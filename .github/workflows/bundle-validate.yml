name: Bundle Validate

# Required check on every PR to `main`. Validates `dev` -- this project has one
# Free Edition workspace, so there's no separate `prod` target (see
# docs/adr/0007); CI/CD automates the same `dev` deployment Chirag previously
# ran by hand, using the novalake-cicd service principal instead of a personal
# profile. See docs/adr/0006 for why this is secret-based auth (env vars, no
# CLI profile) rather than OIDC federation -- Free Edition doesn't expose it.
#
# The workflow deliberately has NO trigger-level `paths:` filter; the scoping
# happens inside the job instead. Reason: a workflow skipped by a `paths:`
# filter reports no status at all -- not "skipped", *nothing* -- so a
# path-filtered required check leaves every docs-only PR stuck forever on
# "Expected -- waiting for status to be reported". Filtering inside the job
# means this check always reports a result and can therefore safely be
# required. See issue #13.

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: https://dbc-0fadb959-36a9.cloud.databricks.com
      DATABRICKS_CLIENT_ID: 3ee2f464-5c6c-4aee-b1b8-792210883a3a # novalake-cicd
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff against the PR base

      # Compare against the PR's recorded base SHA rather than a remote ref
      # name, so this doesn't depend on how the runner named its remotes.
      - id: scope
        name: Does this PR touch the bundle?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -Eq '^(databricks\.yml|resources/|src/|\.github/workflows/bundle-)'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Bundle paths changed -- running bundle validate."
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No bundle paths changed -- nothing to validate."
          fi

      - uses: databricks/setup-cli@dd60b7b133203edca3e8f08b1e053c43a979296e # v1.8.0
        if: steps.scope.outputs.touched == 'true'

      - if: steps.scope.outputs.touched == 'true'
        run: databricks bundle validate -t dev
